<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Avengers Character Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>AVENGERS CHARACTER SEARCH</h1>
    </header>

    <div class="container">

        <label for="searchInput" class="label">Search by Full Name or Alias</label>

        <div class="search-row">
            <input type="text" id="searchInput" placeholder="e.g. Captain America or Steve Rogers">
            <button id="searchBtn">Search</button>
        </div>

        <h2 class="result-title">RESULT</h2>
        <hr>

        <div id="result"></div>

    </div>

    <script src="app.js"></script>
</body>
</html>
